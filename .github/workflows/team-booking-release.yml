name: Team booking release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    name: Supabase staging checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - run: npm ci
      - run: npm run build
      - name: Replay migrations on a clean Supabase database
        run: supabase start
      - name: Verify a populated database upgrades without losing bookings
        run: |
          supabase db reset --local --version 20261120000400
          docker exec -i supabase_db_mpr-project psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/legacy-booking-fixture.sql
          supabase migration up --local
          docker exec -i supabase_db_mpr-project psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/check-upgraded-booking.sql
      - name: Run Edge Function and database regression tests
        run: |
          set -a
          source <(supabase status -o env)
          set +a
          supabase functions serve > "${RUNNER_TEMP}/mpr-functions.log" 2>&1 &
          for attempt in {1..30}; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "apikey: $ANON_KEY" -H 'Content-Type: application/json' \
              -d '{}' "$API_URL/functions/v1/mpr-api" || true)
            if [ "$status" = 401 ]; then break; fi
            sleep 2
          done
          if [ "$status" != 401 ]; then cat "${RUNNER_TEMP}/mpr-functions.log"; exit 1; fi
          npm run test:staging
      - name: Stop local Supabase
        if: always()
        run: supabase stop

  production:
    name: Deploy verified release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: staging
    environment: production
    concurrency:
      group: team-booking-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Validate release targets and prepare the frontend build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          : "${VERCEL_TOKEN:?}" "${VERCEL_ORG_ID:?}" "${VERCEL_PROJECT_ID:?}" "${VERCEL_CLI_VERSION:?}"
          : "${SUPABASE_DB_URL:?}" "${SUPABASE_ACCESS_TOKEN:?}" "${SUPABASE_PROJECT_REF:?}"
          if [[ ! "$VERCEL_ORG_ID" =~ ^team_[[:alnum:]]+$ ]] || [[ ! "$VERCEL_PROJECT_ID" =~ ^prj_[[:alnum:]]+$ ]]; then
            echo "::error::Use the Team ID for VERCEL_ORG_ID and the Project ID for VERCEL_PROJECT_ID from Vercel General settings."
            exit 1
          fi
          if ! status=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --get --data-urlencode "teamId=$VERCEL_ORG_ID" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID"); then
            echo "::error::Could not connect to the Vercel API."
            exit 1
          fi
          case "$status" in
            200) echo "Vercel token can read the configured project." ;;
            401) echo "::error::Vercel rejected VERCEL_TOKEN. Check that the token is valid and unexpired."; exit 1 ;;
            403) echo "::error::Vercel denied project access. Check that VERCEL_TOKEN is scoped to the project's team and that its owner has access."; exit 1 ;;
            404) echo "::error::Vercel could not resolve the project in the configured team. Verify that both IDs come from the same workspace and that the token can see the project."; exit 1 ;;
            *) echo "::error::Vercel project lookup returned HTTP $status."; exit 1 ;;
          esac
          npm install --global "vercel@$VERCEL_CLI_VERSION"
          # Fetch only the two public client settings required to build the SPA.
          # The CLI pull command also looks up user and team settings.
          node --input-type=module <<'NODE'
          import { appendFileSync, mkdirSync, writeFileSync } from 'node:fs';

          const { VERCEL_ORG_ID: orgId, VERCEL_PROJECT_ID: projectId, VERCEL_TOKEN, GITHUB_ENV } = process.env;
          async function getVercel(path, description) {
            const url = new URL(path, 'https://api.vercel.com');
            url.searchParams.set('teamId', orgId);
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${VERCEL_TOKEN}` },
              signal: AbortSignal.timeout(20_000),
              redirect: 'error',
            });
            if (!response.ok) throw new Error(`${description} failed (Vercel HTTP ${response.status}).`);
            return response.json();
          }

          const { envs } = await getVercel(`/v10/projects/${projectId}/env`, 'Reading project environment settings');
          const entries = await Promise.all(['VITE_SUPABASE_URL', 'VITE_SUPABASE_ANON_KEY'].map(async key => {
            const matching = envs.filter(env => env.key === key && env.target?.includes('production') && !env.gitBranch);
            if (matching.length !== 1 || !matching[0].id) {
              throw new Error(`Set exactly one ${key} value for Production in Vercel project settings.`);
            }
            const { value } = await getVercel(`/v1/projects/${projectId}/env/${encodeURIComponent(matching[0].id)}`, `Reading ${key}`);
            if (typeof value !== 'string' || !value || /\s/.test(value)) {
              throw new Error(`Vercel returned an empty or invalid ${key} value.`);
            }
            return [key, value];
          }));
          const { VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY } = Object.fromEntries(entries);
          if (!/^https:\/\/[^/]+\/?$/.test(VITE_SUPABASE_URL)) throw new Error('VITE_SUPABASE_URL must be an HTTPS project URL.');
          // Only publishable keys and legacy anon JWTs belong in client bundles.
          const jwt = VITE_SUPABASE_ANON_KEY.split('.');
          const isPublicKey = VITE_SUPABASE_ANON_KEY.startsWith('sb_publishable_') ||
            (jwt.length === 3 && JSON.parse(Buffer.from(jwt[1], 'base64url').toString()).role === 'anon');
          if (!isPublicKey) throw new Error('VITE_SUPABASE_ANON_KEY must be a publishable or legacy anon key.');
          appendFileSync(GITHUB_ENV, entries.map(([key, value]) => `${key}=${value}\n`).join(''));
          mkdirSync('.vercel/output', { recursive: true });
          writeFileSync('.vercel/project.json', JSON.stringify({ orgId, projectId }));
          writeFileSync('.vercel/output/config.json', JSON.stringify({
            version: 3,
            routes: [{ handle: 'filesystem' }, { src: '/(.*)', dest: '/index.html' }],
          }));
          NODE
      - name: Build the prebuilt frontend
        run: |
          npm ci
          npm run build
          mkdir -p .vercel/output/static
          cp -a dist/. .vercel/output/static/
      - name: Verify migration history and deploy the backend
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/checks/verify-production-history.sql
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run --skip-vault
          supabase db push --db-url "$SUPABASE_DB_URL" --yes --skip-vault
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
      - name: Publish the verified frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
